<!DOCTYPE html>
<html>
<head>
  <title>Loan Eligibility Prediction</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #1e3c72, #2a5298);
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      margin: 0;
      padding: 20px;
    }

    .container {
      background: white;
      padding: 30px;
      border-radius: 15px;
      width: 420px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      text-align: center;
    }

    h2 {
      margin-bottom: 20px;
      color: #2a5298;
    }

    input, select {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border-radius: 8px;
      border: 1px solid #ccc;
    }

    button {
      width: 100%;
      padding: 12px;
      background: #2a5298;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 16px;
    }

    button:hover {
      background: #1e3c72;
    }

    .result {
      margin-top: 15px;
      font-size: 18px;
      font-weight: bold;
    }

    .eligible {
      color: green;
    }

    .not-eligible {
      color: red;
    }

    .history {
      background: white;
      margin-top: 25px;
      padding: 20px;
      border-radius: 15px;
      width: 420px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    }

    .history h3 {
      margin-bottom: 10px;
      color: #2a5298;
    }

    .history-item {
      font-size: 14px;
      padding: 8px;
      border-bottom: 1px solid #eee;
      white-space: pre-line;
      text-align: left;
    }
  </style>
</head>

<body>

<div class="container">
  <h2>Loan Eligibility Predictor</h2>

  <input type="number" id="age" placeholder="Enter Your Age" min="1" />
  <input type="number" id="income" placeholder="Enter Monthly Income" min="0" />
  <input type="number" id="loanAmount" placeholder="Enter Loan Amount" min="0" />

  <select id="creditHistory">
    <option value="">Select Credit History</option>
    <option value="1">Good</option>
    <option value="0">Bad</option>
  </select>

  <select id="employment">
    <option value="">Employment Type</option>
    <option value="salaried">Salaried</option>
    <option value="self">Self-Employed</option>
  </select>

  <button onclick="predictLoan()">Check Eligibility</button>

  <div class="result" id="result"></div>
</div>

<div class="history">
  <h3>Prediction History</h3>
  <div id="historyList"></div>
</div>

<script>
let historyData = [];

function predictLoan() {
  const age = parseInt(document.getElementById("age").value);
  const income = parseFloat(document.getElementById("income").value);
  const loanAmount = parseFloat(document.getElementById("loanAmount").value);
  const creditHistory = document.getElementById("creditHistory").value;
  const employment = document.getElementById("employment").value;
  const resultDiv = document.getElementById("result");

  if (!age || !income || !loanAmount || creditHistory === "" || employment === "") {
    resultDiv.innerHTML = "Please fill all fields!";
    resultDiv.className = "result not-eligible";
    return;
  }

  if (age < 18) {
    resultDiv.innerHTML = "❌ You must be at least 18 years old to apply.";
    resultDiv.className = "result not-eligible";
    return;
  }

  let eligible = false;

  if (income >= 30000 && loanAmount <= 500000) {
    eligible = true;
  }

  if (eligible) {
    resultDiv.innerHTML = "✅ Congratulations! You are Eligible for the Loan.";
    resultDiv.className = "result eligible";
  } else {
    resultDiv.innerHTML = "❌ Sorry! You are Not Eligible for the Loan.";
    resultDiv.className = "result not-eligible";
  }

  const statusText = eligible ? "Eligible" : "Not Eligible";

  const record = `
Age: ${age}
Monthly Income: ₹${income}
Loan Amount: ₹${loanAmount}
Credit History: ${creditHistory === "1" ? "Good" : "Bad"}
Employment Type: ${employment}
Result: ${statusText}
`;

  historyData.push(record);
  displayHistory();
}

function displayHistory() {
  const historyList = document.getElementById("historyList");
  historyList.innerHTML = "";

  historyData.forEach(item => {
    const div = document.createElement("div");
    div.className = "history-item";
    div.textContent = item;
    historyList.appendChild(div);
  });
}
</script>

</body>
</html>
